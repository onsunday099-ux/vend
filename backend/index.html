<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vending Machine Backend</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: #f1f5f9; 
            color: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 36px 30px; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); 
            text-align: center; 
            max-width: 420px; 
            width: 90%;
        }
        .badge { 
            display: inline-block; 
            padding: 6px 14px; 
            background: #ecfdf5; 
            color: #059669; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 16px; 
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #2563eb; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .btn { 
            display: block; 
            padding: 12px; 
            margin: 10px 0; 
            background: #2563eb; 
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 14px; 
            transition: 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-outline { 
            background: white; 
            color: #2563eb; 
            border: 1.5px solid #2563eb; 
        }
        .btn-outline:hover { background: #eff6ff; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Server is Online</span>
        <h1>VENDING MACHINE</h1>
        <p>ระบบ Backend เซิร์ฟเวอร์ตู้จำหน่ายสินค้ากำลังทำงาน</p>
        <a class="btn" href="/docs">เปิดเอกสารทดสอบ API (/docs)</a>
        <a class="btn btn-outline" href="/api/slots">ดูข้อมูลช่องสินค้า (/api/slots)</a>
        <a class="btn" href="/restock" style="background: #059669;">หน้าจัดการสต็อกสินค้า (/restock)</a>
    </div>
</body>
</html>
