<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>จำลองการหยอดเงิน (Cash Acceptor)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; width: 360px; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
    h2 { font-size: 18px; color: #1e293b; margin-bottom: 20px; }
    .info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 16px; text-align: left; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .val { font-weight: bold; }
    .val.primary { color: #2563eb; font-size: 18px; }
    .val.green { color: #16a34a; font-size: 18px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-idle { background: #e2e8f0; color: #64748b; }
    .status-active { background: #dbeafe; color: #1e40af; }
    .status-done { background: #dcfce7; color: #15803d; }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    button { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.1s; }
    button:hover:not(:disabled) { background: #2563eb; color: white; border-color: #2563eb; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-cancel { width: 100%; margin-top: 16px; background: #fff1f2; color: #e11d48; border-color: #fecdd3; padding: 10px; border-radius: 10px; }
    .btn-cancel:hover:not(:disabled) { background: #e11d48; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>จำลองการหยอดเงิน (Cash Acceptor)</h2>
  <div class="info-box">
    <div class="row">
      <span>สถานะ:</span>
      <span id="statusBadge" class="status-badge status-idle">ไม่มีรายการ</span>
    </div>
    <div class="row">
      <span>ยอดที่ต้องชำระ:</span>
      <span id="amountDue" class="val primary">฿0</span>
    </div>
    <div class="row">
      <span>ยอดที่หยอดแล้ว:</span>
      <span id="amountInserted" class="val green">฿0</span>
    </div>
    <div class="row" style="margin-bottom: 0;">
      <span>เงินทอน:</span>
      <span id="change" class="val">฿0</span>
    </div>
  </div>

  <div style="font-size: 13px; color: #64748b; text-align: left; margin-bottom: 4px;">หยอดเหรียญ</div>
  <div class="btn-grid">
    <button class="cash-btn" onclick="insertCash(1)">1฿</button>
    <button class="cash-btn" onclick="insertCash(2)">2฿</button>
    <button class="cash-btn" onclick="insertCash(5)">5฿</button>
    <button class="cash-btn" onclick="insertCash(10)">10฿</button>
  </div>

  <div style="font-size: 13px; color: #64748b; text-align: left; margin-top: 12px; margin-bottom: 4px;">สอดธนบัตร</div>
  <div class="btn-grid">
    <button class="cash-btn" onclick="insertCash(20)">20฿</button>
    <button class="cash-btn" onclick="insertCash(50)">50฿</button>
    <button class="cash-btn" onclick="insertCash(100)">100฿</button>
    <button class="cash-btn" onclick="insertCash(500)">500฿</button>
  </div>

  <button id="cancelBtn" class="btn-cancel" onclick="cancelSession()" disabled>ยกเลิกและคืนเงิน</button>
</div>

<script>
  let ws;
  let isActive = false;

  function connect() {
    ws = new WebSocket("ws://" + window.location.host + "/api/cash/ws");

    ws.onmessage = function(event) {
      const msg = JSON.parse(event.data);
      if (msg.type === "cash_update") {
        updateUI(msg.data);
      }
    };

    ws.onclose = function() {
      setTimeout(connect, 1500); // Reconnect เมื่อหลุด
    };
  }

  function updateUI(data) {
    isActive = data.isActive;
    document.getElementById("amountDue").innerText = "฿" + data.amountDue;
    document.getElementById("amountInserted").innerText = "฿" + data.amountInserted;
    document.getElementById("change").innerText = "฿" + data.change;

    const badge = document.getElementById("statusBadge");
    const cancelBtn = document.getElementById("cancelBtn");
    const buttons = document.querySelectorAll(".cash-btn");

    if (!data.isActive) {
      badge.className = "status-badge status-idle";
      badge.innerText = "ไม่มีรายการ";
      cancelBtn.disabled = true;
      buttons.forEach(b => b.disabled = true);
    } else if (data.isCompleted) {
      badge.className = "status-badge status-done";
      badge.innerText = "ชำระเงินสำเร็จ!";
      cancelBtn.disabled = true;
      buttons.forEach(b => b.disabled = true);
    } else {
      badge.className = "status-badge status-active";
      badge.innerText = "กำลังรอรับเงิน...";
      cancelBtn.disabled = false;
      buttons.forEach(b => b.disabled = false);
    }
  }

  function insertCash(val) {
    if (!ws || !isActive) return;
    ws.send(JSON.stringify({ action: "insert_cash", amount: val }));
  }

  function cancelSession() {
    if (!ws) return;
    ws.send(JSON.stringify({ action: "cancel_session" }));
  }

  connect();
</script>
</body>
</html>
